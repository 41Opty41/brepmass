<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" role="img" aria-label="brepmass logo">
  <!-- Geometric mark: triangulated isometric octahedron with principal inertia axes and centroid -->
  <g transform="translate(44,44)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Faceted octahedron / mesh -->
    <polygon points="0,-31 -27,0 0,8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
    <polygon points="0,-31 27,0 0,8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
    <polygon points="-27,0 0,31 0,8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.8"/>
    <polygon points="27,0 0,31 0,8" fill="#FDBA74" stroke="#EA580C" stroke-width="1.8"/>
    <!-- Internal triangulation seams -->
    <line x1="-27" y1="0" x2="27" y2="0" stroke="#C2410C" stroke-width="1.1" stroke-dasharray="2.5 2"/>
    <line x1="0" y1="-31" x2="0" y2="31" stroke="#C2410C" stroke-width="1.1" stroke-dasharray="2.5 2"/>
    <!-- Principal inertia axes extending past vertices -->
    <line x1="0" y1="-31" x2="0" y2="-39" stroke="#0F172A" stroke-width="2"/>
    <polyline points="-3,-35.5 0,-39.5 3,-35.5" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="15" y1="12" x2="34" y2="23" stroke="#0F172A" stroke-width="2"/>
    <polyline points="29,24.5 34.5,23.3 32.8,18" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="-15" y1="12" x2="-34" y2="23" stroke="#0F172A" stroke-width="2"/>
    <polyline points="-32.8,18 -34.5,23.3 -29,24.5" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Centroid target marker -->
    <circle cx="0" cy="4" r="5" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <circle cx="0" cy="4" r="2.2" fill="#EA580C"/>
  </g>
  <text x="96" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="35" letter-spacing="-0.8">
    <tspan font-weight="600" fill="#0F172A">brep</tspan><tspan font-weight="800" fill="#EA580C">mass</tspan>
  </text>
  <text x="98" y="66" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#475569">
    C99 MASS · INERTIA · MESH
  </text>
</svg>
